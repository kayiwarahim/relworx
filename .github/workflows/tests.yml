name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '^8.0'
          - php: '8.2'
            testbench: '^9.0'
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Constrain Testbench to the Laravel compatibility line
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
      - name: Resolve dependencies
        # Composer currently blocks the Laravel versions required by several
        # Testbench matrix lines due to advisories. This exception is limited
        # to CI test dependency resolution; it does not change consumer installs.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: composer test
