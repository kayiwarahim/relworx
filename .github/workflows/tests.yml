name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '^8.0'
          - php: '8.2'
            testbench: '^9.0'
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Constrain Testbench to the Laravel compatibility line
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
      - name: Resolve dependencies (PHP 8.1 legacy compatibility)
        if: matrix.php == '8.1'
        # Laravel 10 is advisory-flagged by Composer; scope this test-only exception
        # to the legacy PHP 8.1 / Testbench 8 compatibility job.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Resolve dependencies
        if: matrix.php != '8.1'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: composer test
